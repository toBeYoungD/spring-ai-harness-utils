<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件与执行安全多重保障</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 1280px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #fb7185; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 1100px; display: block; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .card { background: rgba(15, 23, 42, 0.5); border-radius: 0.75rem; border: 1px solid #1e293b; padding: 1.25rem; }
    .card-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .card-dot { width: 8px; height: 8px; border-radius: 50%; }
    .card-dot.cyan { background: #22d3ee; } .card-dot.emerald { background: #34d399; } .card-dot.violet { background: #a78bfa; } .card-dot.amber { background: #fbbf24; } .card-dot.rose { background: #fb7185; }
    .card h3 { font-size: 0.875rem; font-weight: 600; }
    .card ul { list-style: none; color: #94a3b8; font-size: 0.75rem; }
    .card li { margin-bottom: 0.375rem; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
    .toolbar { display: flex; gap: 0.5rem; margin-left: auto; flex-shrink: 0; align-items: center; }
    .toolbar-toggle { background: transparent; border: none; color: #475569; cursor: pointer; font-size: 1.25rem; line-height: 1; padding: 0.25rem 0.5rem; border-radius: 0.375rem; transition: color 0.2s, background 0.2s; }
    .toolbar-toggle:hover { color: #94a3b8; background: rgba(30, 41, 59, 0.5); }
    .toolbar-actions { display: none; gap: 0.5rem; }
    .toolbar.expanded .toolbar-actions { display: flex; }
    .toolbar-actions button { background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; color: #94a3b8; padding: 0.375rem 0.75rem; border-radius: 0.375rem; font-family: inherit; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .toolbar-actions button:hover { background: rgba(51, 65, 85, 0.8); color: white; border-color: #475569; }
    @media print { body { background: #020617; padding: 1rem; } .toolbar { display: none !important; } }
  </style>
</head>
<body>
  <div class="container" id="report-container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>文件与执行安全多重保障</h1>
        <div class="toolbar">
          <div class="toolbar-actions">
            <button onclick="copyAsImage(this)">📋 Copy</button>
            <button onclick="downloadPNG(this)">🖼️ PNG</button>
            <button onclick="downloadPDF(this)">📄 PDF</button>
          </div>
          <button class="toolbar-toggle" onclick="this.parentElement.classList.toggle('expanded')" title="Export options" aria-label="Export options">⋯</button>
        </div>
      </div>
      <p class="subtitle">文件系统侧 + 执行沙箱侧 · 双重维度保障安全,文件不丢失</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1220 580">
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- 左栏标题: 文件系统安全 -->
        <rect x="40" y="25" width="540" height="40" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="310" y="50" fill="white" font-size="13" font-weight="600" text-anchor="middle">文件系统安全(本 MCP Server 保障)</text>

        <!-- ① 工作区隔离 (Security/rose) -->
        <rect x="40" y="80" width="540" height="95" rx="6" fill="#0f172a"/>
        <rect x="40" y="80" width="540" height="95" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="55" y="103" fill="white" font-size="12" font-weight="600">① 工作区隔离</text>
        <text x="55" y="122" fill="#94a3b8" font-size="9">每个身份独占存储前缀,路径强制约束在前缀内</text>
        <text x="55" y="138" fill="#94a3b8" font-size="9">绝对路径拒绝,内部目录(.snapshots/.trash/.shadow)隐藏</text>
        <text x="55" y="160" fill="#fb7185" font-size="8">效果:从源头杜绝跨工作区越权访问</text>

        <!-- ② 版本快照与回退 (MessageBus/orange) -->
        <rect x="40" y="185" width="540" height="95" rx="6" fill="#0f172a"/>
        <rect x="40" y="185" width="540" height="95" rx="6" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="55" y="208" fill="white" font-size="12" font-weight="600">② 版本快照与回退</text>
        <text x="55" y="227" fill="#94a3b8" font-size="9">写/编辑前自动快照,Rewind 回退前再存安全快照</text>
        <text x="55" y="243" fill="#94a3b8" font-size="9">undo-of-undo,撤销也能再撤销</text>
        <text x="55" y="265" fill="#fb923c" font-size="8">效果:任意修改可回退到历史版本</text>

        <!-- ③ 回收站软删除 (Backend/emerald) -->
        <rect x="40" y="290" width="540" height="95" rx="6" fill="#0f172a"/>
        <rect x="40" y="290" width="540" height="95" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="55" y="313" fill="white" font-size="12" font-weight="600">③ 回收站软删除</text>
        <text x="55" y="332" fill="#94a3b8" font-size="9">删除移入 .trash/ 而非物理删除</text>
        <text x="55" y="348" fill="#94a3b8" font-size="9">按时间戳保留,可恢复</text>
        <text x="55" y="370" fill="#34d399" font-size="8">效果:误删文件可从回收站恢复</text>

        <!-- 右栏标题: 执行沙箱安全 -->
        <rect x="620" y="25" width="560" height="40" rx="6" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="900" y="50" fill="white" font-size="13" font-weight="600" text-anchor="middle">执行沙箱安全(python / shell / browser_use)</text>

        <!-- ④ 容器级隔离 (Security/rose) -->
        <rect x="620" y="80" width="560" height="95" rx="6" fill="#0f172a"/>
        <rect x="620" y="80" width="560" height="95" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="635" y="103" fill="white" font-size="12" font-weight="600">④ 容器级隔离</text>
        <text x="635" y="122" fill="#94a3b8" font-size="9">python / shell / browser_use 在独立沙箱执行</text>
        <text x="635" y="138" fill="#94a3b8" font-size="9">按用户/会话容器级隔离,互不影响</text>
        <text x="635" y="160" fill="#fb7185" font-size="8">效果:执行环境互不影响</text>

        <!-- ⑤ 工作区挂载 (MessageBus/orange) -->
        <rect x="620" y="185" width="560" height="95" rx="6" fill="#0f172a"/>
        <rect x="620" y="185" width="560" height="95" rx="6" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="635" y="208" fill="white" font-size="12" font-weight="600">⑤ 工作区挂载</text>
        <text x="635" y="227" fill="#94a3b8" font-size="9">沙箱挂载该用户工作区到 /workspace</text>
        <text x="635" y="243" fill="#94a3b8" font-size="9">可访问但不可越界</text>
        <text x="635" y="265" fill="#fb923c" font-size="8">效果:执行权限不突破文件隔离</text>

        <!-- ⑥ 执行与存储分离 (External/slate) -->
        <rect x="620" y="290" width="560" height="95" rx="6" fill="#0f172a"/>
        <rect x="620" y="290" width="560" height="95" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="635" y="313" fill="white" font-size="12" font-weight="600">⑥ 执行与存储分离</text>
        <text x="635" y="332" fill="#94a3b8" font-size="9">执行环境独立于文件存储</text>
        <text x="635" y="348" fill="#94a3b8" font-size="9">危险操作不波及他人/主存储</text>
        <text x="635" y="370" fill="#94a3b8" font-size="8">效果:危险代码被限制在沙箱内</text>

        <!-- 汇总 (Cloud/amber,不透明背景遮挡虚线) -->
        <rect x="120" y="410" width="980" height="80" rx="8" fill="#0f172a"/>
        <rect x="120" y="410" width="980" height="80" rx="8" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="610" y="435" fill="white" font-size="12" font-weight="600" text-anchor="middle">文件侧:访问受控 · 误改可退 · 误删可恢(文件不丢失)</text>
        <text x="610" y="455" fill="white" font-size="12" font-weight="600" text-anchor="middle">执行侧:python / shell / browser_use 沙箱隔离(执行受控)</text>
        <text x="610" y="478" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">=> 文件与执行双重安全保障</text>

        <!-- 虚线:各机制 -> 汇总 -->
        <line x1="310" y1="385" x2="310" y2="410" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="900" y1="385" x2="900" y2="410" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- 底注 -->
        <text x="610" y="525" fill="#475569" font-size="9" text-anchor="middle">文件系统与沙箱分离:文件操作无需容器,少量资源服务多用户;执行类按需开沙箱,资源按用户隔离</text>

        <!-- 图例 -->
        <text x="40" y="555" fill="#475569" font-size="8">机制色:隔离/拒绝 鉴权,版本/挂载 中间件,回收站/恢复 存储,外部依赖 中性</text>
      </svg>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-header"><div class="card-dot rose"></div><h3>文件系统安全</h3></div>
        <ul>
          <li>• ① 工作区隔离防越权</li>
          <li>• ② 快照回退防误改</li>
          <li>• ③ 回收站防误删</li>
        </ul>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-dot amber"></div><h3>执行沙箱安全</h3></div>
        <ul>
          <li>• ④ 容器级隔离</li>
          <li>• ⑤ 工作区挂载不越界</li>
          <li>• ⑥ 执行与存储分离</li>
        </ul>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-dot emerald"></div><h3>协同保障</h3></div>
        <ul>
          <li>• 访问受控(隔离)</li>
          <li>• 误改可退(快照)</li>
          <li>• 误删可恢(回收站)</li>
          <li>• 执行受控(沙箱)</li>
        </ul>
      </div>
    </div>

    <p class="footer">文件与执行安全多重保障(深色版)· 生成自 architecture-diagram skill</p>
  </div>

  <script>
    async function copyAsImage(btn) { const orig = btn.textContent; try { const el = document.getElementById('report-container'); const r = el.getBoundingClientRect(); const pad = 32; const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 }); const blob = await new Promise(r => canvas.toBlob(r, 'image/png')); await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); btn.textContent = '✓ Copied!'; } catch (e) { btn.textContent = '✗ Failed'; } setTimeout(() => btn.textContent = orig, 2000); }
    async function downloadPNG(btn) { const orig = btn.textContent; btn.textContent = '⏳ ...'; try { const el = document.getElementById('report-container'); const r = el.getBoundingClientRect(); const pad = 32; const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 }); const link = document.createElement('a'); link.download = '06-security-overview.png'; link.href = canvas.toDataURL('image/png'); link.click(); btn.textContent = '✓ Done!'; } catch (e) { btn.textContent = '✗ Failed'; } setTimeout(() => btn.textContent = orig, 2000); }
    async function downloadPDF(btn) { const orig = btn.textContent; btn.textContent = '⏳ ...'; try { const el = document.getElementById('report-container'); const r = el.getBoundingClientRect(); const pad = 32; const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 }); const imgData = canvas.toDataURL('image/png'); const { jsPDF } = window.jspdf; const orientation = canvas.width > canvas.height ? 'landscape' : 'portrait'; const pdf = new jsPDF({ orientation, unit: 'px', format: [canvas.width, canvas.height], hotfixes: ['px_scaling'] }); pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height); pdf.save('06-security-overview.pdf'); btn.textContent = '✓ Done!'; } catch (e) { btn.textContent = '✗ Failed'; } setTimeout(() => btn.textContent = orig, 2000); }
  </script>
</body>
</html>
