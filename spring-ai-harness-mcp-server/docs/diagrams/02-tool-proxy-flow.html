<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具代理逻辑(所有工具通用)</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'JetBrains Mono', monospace; background: #020617; min-height: 100vh; padding: 2rem; color: white; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container { background: rgba(15, 23, 42, 0.5); border-radius: 1rem; border: 1px solid #1e293b; padding: 1.5rem; overflow-x: auto; }
    svg { width: 100%; min-width: 760px; display: block; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-top: 2rem; }
    .card { background: rgba(15, 23, 42, 0.5); border-radius: 0.75rem; border: 1px solid #1e293b; padding: 1.25rem; }
    .card-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
    .card-dot { width: 8px; height: 8px; border-radius: 50%; }
    .card-dot.cyan { background: #22d3ee; } .card-dot.emerald { background: #34d399; } .card-dot.violet { background: #a78bfa; } .card-dot.amber { background: #fbbf24; } .card-dot.rose { background: #fb7185; }
    .card h3 { font-size: 0.875rem; font-weight: 600; }
    .card ul { list-style: none; color: #94a3b8; font-size: 0.75rem; }
    .card li { margin-bottom: 0.375rem; }
    .footer { text-align: center; margin-top: 1.5rem; color: #475569; font-size: 0.75rem; }
    .toolbar { display: flex; gap: 0.5rem; margin-left: auto; flex-shrink: 0; align-items: center; }
    .toolbar-toggle { background: transparent; border: none; color: #475569; cursor: pointer; font-size: 1.25rem; line-height: 1; padding: 0.25rem 0.5rem; border-radius: 0.375rem; transition: color 0.2s, background 0.2s; }
    .toolbar-toggle:hover { color: #94a3b8; background: rgba(30, 41, 59, 0.5); }
    .toolbar-actions { display: none; gap: 0.5rem; }
    .toolbar.expanded .toolbar-actions { display: flex; }
    .toolbar-actions button { background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; color: #94a3b8; padding: 0.375rem 0.75rem; border-radius: 0.375rem; font-family: inherit; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .toolbar-actions button:hover { background: rgba(51, 65, 85, 0.8); color: white; border-color: #475569; }
    @media print { body { background: #020617; padding: 1rem; } .toolbar { display: none !important; } }
  </style>
</head>
<body>
  <div class="container" id="report-container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>工具代理逻辑(所有工具通用)</h1>
        <div class="toolbar">
          <div class="toolbar-actions">
            <button onclick="copyAsImage(this)">📋 Copy</button>
            <button onclick="downloadPNG(this)">🖼️ PNG</button>
            <button onclick="downloadPDF(this)">📄 PDF</button>
          </div>
          <button class="toolbar-toggle" onclick="this.parentElement.classList.toggle('expanded')" title="Export options" aria-label="Export options">⋯</button>
        </div>
      </div>
      <p class="subtitle">不区分具体工具 · 身份隔离 -> 装配存储 -> 执行 -> 返回</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 760 540">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- 开始 -->
        <rect x="230" y="25" width="300" height="50" rx="25" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="380" y="48" fill="white" font-size="12" font-weight="600" text-anchor="middle">MCP 工具调用请求</text>
        <text x="380" y="64" fill="#94a3b8" font-size="9" text-anchor="middle">携带身份标识</text>

        <!-- 身份识别 (Security/rose) -->
        <rect x="230" y="110" width="300" height="55" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="380" y="133" fill="white" font-size="12" font-weight="600" text-anchor="middle">身份识别与校验</text>
        <text x="380" y="150" fill="#94a3b8" font-size="9" text-anchor="middle">-> 工作区身份 WorkspaceIdentity</text>

        <!-- 装配隔离存储 (Backend/emerald) -->
        <rect x="230" y="200" width="300" height="55" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="380" y="223" fill="white" font-size="12" font-weight="600" text-anchor="middle">按身份装配隔离存储实例</text>
        <text x="380" y="240" fill="#94a3b8" font-size="9" text-anchor="middle">StorageProviderFactory.getStorageProvider(ctx)</text>

        <!-- 装饰器增强 (MessageBus/orange) -->
        <rect x="230" y="290" width="300" height="55" rx="6" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"/>
        <text x="380" y="313" fill="white" font-size="12" font-weight="600" text-anchor="middle">可选:叠加配额 / 可观测装饰器</text>
        <text x="380" y="330" fill="#94a3b8" font-size="9" text-anchor="middle">洋葱式包裹,关闭零开销</text>

        <!-- 工具执行 (Frontend/cyan) -->
        <rect x="190" y="380" width="380" height="60" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="380" y="404" fill="white" font-size="12" font-weight="600" text-anchor="middle">工具执行(通用)</text>
        <text x="380" y="422" fill="#94a3b8" font-size="9" text-anchor="middle">文件读写 / 搜索 / 快照 / 技能等</text>

        <!-- 返回 -->
        <rect x="250" y="475" width="260" height="45" rx="22" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="380" y="502" fill="white" font-size="12" font-weight="600" text-anchor="middle">返回结果</text>

        <!-- 箭头 -->
        <line x1="380" y1="75" x2="380" y2="108" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="380" y1="165" x2="380" y2="198" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="380" y1="255" x2="380" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="380" y1="345" x2="380" y2="378" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <line x1="380" y1="440" x2="380" y2="473" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- 旁注 -->
        <text x="610" y="250" fill="#475569" font-size="8">所有工具共享</text>
        <text x="610" y="262" fill="#475569" font-size="8">同一代理逻辑,</text>
        <text x="610" y="274" fill="#475569" font-size="8">不因工具类型而异</text>
      </svg>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-header"><div class="card-dot rose"></div><h3>身份隔离</h3></div>
        <ul>
          <li>• 每次请求解析身份</li>
          <li>• 构造工作区身份</li>
          <li>• 隔离边界由此确立</li>
        </ul>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-dot emerald"></div><h3>装配存储</h3></div>
        <ul>
          <li>• 工厂按身份造实例</li>
          <li>• 只看得见自己目录</li>
          <li>• 装饰器按需叠加</li>
        </ul>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-dot cyan"></div><h3>通用执行</h3></div>
        <ul>
          <li>• 不区分具体工具</li>
          <li>• 文件/搜索/快照/技能</li>
          <li>• 统一返回结果</li>
        </ul>
      </div>
    </div>

    <p class="footer">工具代理逻辑(深色版)· 生成自 architecture-diagram skill</p>
  </div>

  <script>
    async function copyAsImage(btn) { const orig = btn.textContent; try { const el = document.getElementById('report-container'); const r = el.getBoundingClientRect(); const pad = 32; const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 }); const blob = await new Promise(r => canvas.toBlob(r, 'image/png')); await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); btn.textContent = '✓ Copied!'; } catch (e) { btn.textContent = '✗ Failed'; } setTimeout(() => btn.textContent = orig, 2000); }
    async function downloadPNG(btn) { const orig = btn.textContent; btn.textContent = '⏳ ...'; try { const el = document.getElementById('report-container'); const r = el.getBoundingClientRect(); const pad = 32; const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 }); const link = document.createElement('a'); link.download = '02-tool-proxy-flow.png'; link.href = canvas.toDataURL('image/png'); link.click(); btn.textContent = '✓ Done!'; } catch (e) { btn.textContent = '✗ Failed'; } setTimeout(() => btn.textContent = orig, 2000); }
    async function downloadPDF(btn) { const orig = btn.textContent; btn.textContent = '⏳ ...'; try { const el = document.getElementById('report-container'); const r = el.getBoundingClientRect(); const pad = 32; const canvas = await html2canvas(document.body, { backgroundColor: '#020617', scale: 2, useCORS: true, ignoreElements: (e) => e.classList && e.classList.contains('toolbar'), x: r.left + window.scrollX - pad, y: r.top + window.scrollY - pad, width: r.width + pad * 2, height: r.height + pad * 2 }); const imgData = canvas.toDataURL('image/png'); const { jsPDF } = window.jspdf; const orientation = canvas.width > canvas.height ? 'landscape' : 'portrait'; const pdf = new jsPDF({ orientation, unit: 'px', format: [canvas.width, canvas.height], hotfixes: ['px_scaling'] }); pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height); pdf.save('02-tool-proxy-flow.pdf'); btn.textContent = '✓ Done!'; } catch (e) { btn.textContent = '✗ Failed'; } setTimeout(() => btn.textContent = orig, 2000); }
  </script>
</body>
</html>
